name: "Yeti Benchmarks"
app_id: "app-benchmarks"
version: "0.1.0"
# Auth handled per-table via @export(public: [...]) directives in schema

static_files:
  path: web
  route: /
  index: index.html

schemas:
  - schema.graphql

resources:
  - "resources/*.rs"

binaries:
  - "bin/*.rs"

modules:
  - "modules/*.rs"

