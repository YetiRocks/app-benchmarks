name: "Yeti Benchmarks"
app_id: "app-benchmarks"
version: "0.1.0"
customer_id: "yeti"
required_roles: [yeti_admin]

static_files:
  path: web
  spa: true
  build:
    sourceDir: source
    command: npm run build

schemas:
  - schema.graphql

resources:
  - "resources/*.rs"

binaries:
  - "bin/*.rs"

modules:
  - "modules/*.rs"

auth:
  methods: [oauth]
  oauth:
    google:
      clientId: "${GOOGLE_CLIENT_ID}"
      clientSecret: "${GOOGLE_CLIENT_SECRET}"
    rules:
      - strategy: email
        pattern: "*@yetirocks.com"
        role: yeti_admin
