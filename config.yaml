name: "Yeti Benchmarks"
app_id: "app-benchmarks"
version: "0.1.0"
require_super_user: true

static_files:
  path: web
  route: /
  index: index.html

schemas:
  - schema.graphql

resources:
  - "resources/*.rs"

binaries:
  - "bin/*.rs"

modules:
  - "modules/*.rs"

auth:
  methods: [oauth]
  oauth:
    google:
      clientId: "${GOOGLE_CLIENT_ID}"
      clientSecret: "${GOOGLE_CLIENT_SECRET}"
    rules:
      - strategy: email
        pattern: "*@yetirocks.com"
        role: super_user
