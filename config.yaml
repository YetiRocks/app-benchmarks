name: "Yeti Benchmarks"
app_id: "app-benchmarks"
version: "0.1.0"
customer_id: "yeti"
required_roles: [yeti_admin]

static:
  path: web
  root: /
  spa: true
  build:
    source: source
    command: npm install && npm run build

schemas:
  path: schema.graphql

resources:
  path: "resources/*.rs"
  root: /api

binaries:
  - "bin/*.rs"

modules:
  - "modules/*.rs"

authLoader:
  roles: auth/roles.json

auth:
  signup: auto
  default_role: yeti_admin
  methods: [oauth]
  oauth:
    google:
      clientId: "${GOOGLE_CLIENT_ID}"
      clientSecret: "${GOOGLE_CLIENT_SECRET}"
    rules:
      - strategy: email
        pattern: "*@yetirocks.com"
        role: yeti_admin

dependencies:
  tokio:
    version: "1"
    features: ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs", "net"]
  reqwest:
    version: "0.13"
    default-features: false
    features: ["rustls-no-provider", "charset", "http2", "json"]
  tracing: "0.1"
  clap:
    version: "4"
    features: ["derive"]
  hdrhistogram: "7"
  chrono:
    version: "0.4"
    features: ["serde"]
  uuid:
    version: "1"
    features: ["v4"]
  rand: "0.9"
  tokio-tungstenite:
    version: "0.26"
    features: ["rustls-tls-native-roots"]
  rustls:
    version: "0.23"
    default-features: false
    features: ["ring"]
  futures: "0.3"
  rumqttc: "0.24"
  tracing-subscriber:
    version: "0.3"
    features: ["env-filter"]
  libc: "0.2"
