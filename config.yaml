name: "Yeti Benchmarks"
app_id: "app-benchmarks"
customer_id: "yeti"
version: "0.1.0"
description: "Yeti Benchmarks"

schemas:
  path: schema.graphql

resources:
  path: "resources/*.rs"
  root: /api

modules:
  - modules/*.rs

binaries:
  - bin/*.rs

static:
  path: web
  root: /
  spa: true
  build:
    source: source
    command: npm install && npm run build

authLoader:
  roles: auth/roles.json

auth:
  methods: [oauth]
  signup: auto
  default_role: yeti_admin
  email_signup: true
  oauth:
    google:
      clientId: "${GOOGLE_CLIENT_ID}"
      clientSecret: "${GOOGLE_CLIENT_SECRET}"
    rules:
      - strategy: email
        pattern: "*@yetirocks.com"
        role: yeti_admin
