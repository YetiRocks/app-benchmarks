name: ci

# Solo-profile CI for app-benchmarks. The yeti CLI's scaffolder (with
# yeti-sdk source bundled inside the prebuilt binary) handles the
# parent workspace, so we don't need to clone YetiRocks/yeti or inject
# any Cargo.toml ourselves — see Phase 51g.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: YetiRocks/yeti-workflows/.github/workflows/yeti-app-ci.yml@main
    with:
      frontend: true
    secrets: inherit
