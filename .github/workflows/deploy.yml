name: Deploy

# app-benchmarks is the internal benchmarking dashboard (yeti_admin
# role gate, oauth-only, internal yetirocks.com email policy). Deploys
# solo (no autoLoad bundle) via the unified yeti-app-deploy.yml.
#
# SAFETY GATE — DRY-RUN IS DEFAULT (temporary):
# Until the new yeti binary is published to Linode + the unified
# pipeline is verified end-to-end, every trigger defaults to dry-run.
# Real deploys require explicit `workflow_dispatch` with
# `dry_run: false` from the Actions UI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package only; skip scp + systemd restart. Default true while the safety gate is on."
        type: boolean
        default: true

jobs:
  deploy:
    uses: YetiRocks/yeti-workflows/.github/workflows/yeti-app-deploy.yml@main
    with:
      service_name: yeti-benchmarks
      service_description: "Yeti Application Platform (app-benchmarks)"
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != false }}
    secrets: inherit
