# Cargo manifest for app-benchmarks — Phase 48 static-crate shape.
#
# Dual-mode during the dylib → static migration window. yeti-compiler
# reads only [dependencies] when building the dylib (retiring in
# Phase 48 slice 5); cargo uses the full file when building the static
# library this crate compiles to.

[package]
name = "app-benchmarks"
version = "0.1.0"
edition = "2024"
description = "app-benchmarks — Phase 48 static-crate shape."

[lib]
name = "app_benchmarks"
path = "src/lib.rs"

[workspace]

[dependencies]
yeti-sdk = { path = "../../../Developer/yeti/crates/yeti-sdk", features = ["workspace"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = "0.3"
rumqttc = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
