# Dependencies for app-benchmarks
#
# The yeti compiler merges this with its generated [package], [lib], and [[bin]]
# sections. Only [dependencies] is read from this file — everything else is
# generated by the compiler (SDK path, crate-type, binary targets, etc.).
#
# Use standard cargo tooling: `cargo add`, IDE autocomplete, docs.rs links all work.

[dependencies]
# Shared with yeti-sdk but needed as direct imports by load test code
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json"] }
serde_json = "1"
tracing = "0.1"

# Benchmark-specific
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
